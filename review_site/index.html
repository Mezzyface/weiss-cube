<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeissCube Profile Browser</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #0f0f0f; color: #e0e0e0; font-size: 13px; }

  #header { background: #1a1a2e; padding: 12px 16px; border-bottom: 2px solid #4a4a8a;
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #header h1 { font-size: 18px; color: #8888ff; font-weight: 700; white-space: nowrap; }
  #stats { color: #888; font-size: 12px; }

  #filters { background: #161625; padding: 10px 16px; border-bottom: 1px solid #2a2a4a;
             display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #filters select, #filters input {
    background: #1e1e30; border: 1px solid #3a3a5a; color: #e0e0e0;
    padding: 5px 8px; border-radius: 4px; font-size: 12px; }
  #filters input[type="text"] { width: 240px; }
  #filters label { color: #888; font-size: 11px; }
  .filter-group { display: flex; align-items: center; gap: 4px; }
  #results-count { color: #888; font-size: 12px; margin-left: auto; }
  button.clear-btn { background: #2a2a3a; border: 1px solid #3a3a5a; color: #aaa;
                     padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  button.clear-btn:hover { background: #3a3a4a; }

  #card-grid { display: grid;
               grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
               gap: 8px; padding: 10px 16px; overflow-y: auto;
               height: calc(100vh - 130px); }

  .card { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 6px;
          padding: 10px 12px; cursor: pointer; transition: border-color 0.15s;
          position: relative; }
  .card:hover { border-color: #6666cc; }
  .card.selected { border-color: #8888ff; background: #1e1e38; }
  .card.cube-pick { border-left: 3px solid #44cc88; }

  .card-header { display: flex; justify-content: space-between; align-items: flex-start;
                 margin-bottom: 4px; gap: 8px; }
  .card-name { font-weight: 600; font-size: 13px; color: #ccd; flex: 1; min-width: 0;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-meta { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }

  .badge { padding: 1px 5px; border-radius: 3px; font-size: 11px; font-weight: 600; }
  .lvl  { background: #2a2a5a; color: #8888ff; }
  .cost { background: #2a3a2a; color: #88cc88; }
  .pwr  { background: #3a2a2a; color: #cc8888; }
  .soul { background: #3a3a1a; color: #cccc66; }
  .trig { background: #2a3a3a; color: #66cccc; }

  .color-bar { height: 3px; border-radius: 2px; margin-bottom: 6px; }
  .color-Red    { background: #cc4444; }
  .color-Blue   { background: #4444cc; }
  .color-Yellow { background: #cccc00; }
  .color-Green  { background: #44aa44; }
  .color-Purple { background: #8844cc; }
  .color-multi  { background: linear-gradient(90deg,#cc4444,#4444cc,#44aa44); }

  .card-effect { font-size: 11px; color: #bbb; line-height: 1.4; margin-top: 4px;
                 max-height: 80px; overflow: hidden; }
  .card-effect.expanded { max-height: none; }

  .card-footer { display: flex; justify-content: space-between; align-items: center;
                 margin-top: 6px; font-size: 10px; color: #666; }
  .variants { color: #6666aa; }

  .keyword { color: #ffaa44; font-weight: 600; }
  .ability-marker { color: #66aaff; font-weight: 600; }
  .trait { color: #aa66ff; }
  .char-ref { color: #ff8866; }

  /* Color filter pills */
  .color-pill { padding: 3px 8px; border-radius: 10px; font-size: 11px; cursor: pointer;
                border: 1px solid transparent; opacity: 0.5; transition: opacity 0.15s; }
  .color-pill.active { opacity: 1; border-color: #ffffff55; }
  .pill-Red    { background: #441111; color: #ff8888; }
  .pill-Blue   { background: #111144; color: #8888ff; }
  .pill-Yellow { background: #333300; color: #ffff44; }
  .pill-Green  { background: #113311; color: #44ff44; }
  .pill-Purple { background: #221133; color: #cc88ff; }

  #detail-panel { display: none; position: fixed; right: 0; top: 0; width: 400px;
                  height: 100vh; background: #13131f; border-left: 2px solid #3a3a6a;
                  padding: 16px; overflow-y: auto; z-index: 100; }
  #detail-panel.open { display: block; }
  #detail-panel h2 { font-size: 15px; color: #aaaaff; margin-bottom: 8px; }
  #detail-panel .detail-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  #detail-panel .detail-effect { font-size: 12px; line-height: 1.6; color: #ddd;
                                  white-space: pre-wrap; word-break: break-word; }
  #detail-panel .detail-cards { margin-top: 10px; font-size: 10px; color: #666;
                                 word-break: break-all; }
  #close-detail { position: absolute; top: 10px; right: 12px; background: none;
                  border: none; color: #888; font-size: 18px; cursor: pointer; }
  #close-detail:hover { color: #fff; }

  .pick-btn { background: #1a3a2a; border: 1px solid #44aa66; color: #44dd88;
              padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-top: 8px; }
  .pick-btn:hover { background: #243a2e; }
  .pick-btn.picked { background: #44aa66; color: #001a00; font-weight: 700; }

  .no-results { text-align: center; color: #555; padding: 60px 20px; font-size: 14px; }
</style>
</head>
<body>

<div id="header">
  <h1>⚔ WeissCube Profile Browser</h1>
  <span id="stats">Loading...</span>
</div>

<div id="filters">
  <div class="filter-group">
    <label>Search</label>
    <input type="text" id="search" placeholder="effect text, name, keyword…" oninput="applyFilters()">
  </div>
  <div class="filter-group">
    <label>Type</label>
    <select id="f-type" onchange="applyFilters()">
      <option value="">All</option>
      <option>Character</option>
      <option>Event</option>
      <option>Climax</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Level</label>
    <select id="f-level" onchange="applyFilters()">
      <option value="">All</option>
      <option>0</option><option>1</option><option>2</option><option>3</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Cost</label>
    <select id="f-cost" onchange="applyFilters()">
      <option value="">All</option>
      <option>0</option><option>1</option><option>2</option><option>3</option>
      <option>4</option><option>5</option><option>6</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Trigger</label>
    <select id="f-trigger" onchange="applyFilters()">
      <option value="">All</option>
      <option>None</option><option>Soul</option><option>2 Soul</option>
      <option>Gate</option><option>Door</option><option>Salvage</option>
      <option>Shot</option><option>Treasure</option><option>Book</option>
      <option>Standby</option><option>Choice</option><option>Soul Bounce</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Color</label>
    <span class="color-pill pill-Red"   id="pill-Red"    onclick="toggleColor('Red')">Red</span>
    <span class="color-pill pill-Blue"  id="pill-Blue"   onclick="toggleColor('Blue')">Blue</span>
    <span class="color-pill pill-Yellow" id="pill-Yellow" onclick="toggleColor('Yellow')">Yellow</span>
    <span class="color-pill pill-Green" id="pill-Green"  onclick="toggleColor('Green')">Green</span>
    <span class="color-pill pill-Purple" id="pill-Purple" onclick="toggleColor('Purple')">Purple</span>
  </div>
  <div class="filter-group">
    <label>Mechanic</label>
    <select id="f-mechanic" onchange="applyFilters()">
      <option value="">Any</option>
      <option value="ENCORE">ENCORE</option>
      <option value="BRAINSTORM">BRAINSTORM</option>
      <option value="BOND">BOND</option>
      <option value="EXPERIENCE">EXPERIENCE</option>
      <option value="SUPPORT">SUPPORT</option>
      <option value="ALARM">ALARM</option>
      <option value="BACKUP">BACKUP</option>
      <option value="CX COMBO">CX COMBO</option>
      <option value="CHANGE">CHANGE</option>
      <option value="STANDBY">STANDBY</option>
      <option value="MERGE">MERGE</option>
      <option value="memory">Memory</option>
      <option value="marker">Marker</option>
    </select>
  </div>
  <button class="clear-btn" onclick="clearFilters()">✕ Clear</button>
  <span id="results-count"></span>
</div>

<div id="card-grid"></div>

<div id="detail-panel">
  <button id="close-detail" onclick="closeDetail()">✕</button>
  <h2 id="d-name"></h2>
  <div class="detail-meta" id="d-meta"></div>
  <div class="detail-effect" id="d-effect"></div>
  <div class="detail-cards" id="d-cards"></div>
  <button class="pick-btn" id="d-pick" onclick="togglePick()">+ Add to Cube</button>
</div>

<script>
let allProfiles = [];
let filtered = [];
let activeColors = new Set();
let cubePicks = new Set(JSON.parse(localStorage.getItem('cubePicks') || '[]'));
let detailId = null;
const PAGE = 120;
let page = 0;

// Syntax highlighting
function highlight(text) {
  if (!text) return '<em style="color:#555">—</em>';
  return text
    .replace(/\[AUTO\]|\[CONT\]|\[ACT\]|\[COUNTER\]/g, m => `<span class="ability-marker">${m}</span>`)
    .replace(/\b(ENCORE|BRAINSTORM|BOND|EXPERIENCE|SUPPORT|ALARM|BACKUP|CX COMBO|CHANGE|STANDBY|MERGE|RECOLLECTION)\b/g,
             m => `<span class="keyword">${m}</span>`)
    .replace(/::TRAIT::/g, '<span class="trait">::TRAIT::</span>')
    .replace(/\[CHARACTER\]/g, '<span class="char-ref">[CHARACTER]</span>');
}

function colorBarClass(colors) {
  if (!colors) return '';
  const cs = colors.split(', ');
  if (cs.length > 1) return 'color-multi';
  return 'color-' + cs[0];
}

function renderCard(p) {
  const isPick = cubePicks.has(p.profile_id);
  const eff = (p.normalized_effect || '').slice(0, 160);
  return `<div class="card ${isPick ? 'cube-pick' : ''}" id="c${p.profile_id}"
               onclick="showDetail(${p.profile_id})">
    <div class="color-bar ${colorBarClass(p.colors)}"></div>
    <div class="card-header">
      <span class="card-name" title="${(p.name_en||'').replace(/"/g,'&quot;')}">${p.name_en || '—'}</span>
      <span class="card-meta">
        <span class="badge lvl">L${p.level ?? '?'}</span>
        <span class="badge cost">C${p.cost ?? '?'}</span>
        <span class="badge pwr">${p.power ?? '?'}</span>
        ${p.triggers && p.triggers !== 'None' ? `<span class="badge trig">${p.triggers}</span>` : ''}
      </span>
    </div>
    <div class="card-effect">${highlight(eff)}${(p.normalized_effect||'').length > 160 ? '…' : ''}</div>
    <div class="card-footer">
      <span>${p.type || ''}</span>
      <span class="variants">${p.variant_count ?? 1}× · ${p.set_count ?? 1} sets</span>
    </div>
  </div>`;
}

function applyFilters() {
  const search = document.getElementById('search').value.toLowerCase();
  const fType = document.getElementById('f-type').value;
  const fLevel = document.getElementById('f-level').value;
  const fCost = document.getElementById('f-cost').value;
  const fTrigger = document.getElementById('f-trigger').value;
  const fMech = document.getElementById('f-mechanic').value;

  filtered = allProfiles.filter(p => {
    if (fType && p.type !== fType) return false;
    if (fLevel !== '' && String(p.level) !== fLevel) return false;
    if (fCost !== '' && String(p.cost) !== fCost) return false;
    if (fTrigger && p.triggers !== fTrigger) return false;
    if (fMech) {
      const eff = (p.normalized_effect || '').toLowerCase();
      if (!eff.includes(fMech.toLowerCase())) return false;
    }
    if (activeColors.size > 0) {
      const cs = (p.colors || '').split(', ');
      if (!cs.some(c => activeColors.has(c))) return false;
    }
    if (search) {
      const haystack = ((p.name_en || '') + ' ' + (p.normalized_effect || '')).toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    return true;
  });

  page = 0;
  renderPage();
  document.getElementById('results-count').textContent = `${filtered.length.toLocaleString()} profiles`;
}

function renderPage() {
  const grid = document.getElementById('card-grid');
  const slice = filtered.slice(0, (page + 1) * PAGE);
  grid.innerHTML = slice.length
    ? slice.map(renderCard).join('')
    : '<div class="no-results">No profiles match these filters.</div>';

  // Infinite scroll sentinel
  if (slice.length < filtered.length) {
    const sentinel = document.createElement('div');
    sentinel.id = 'scroll-sentinel';
    sentinel.style.height = '1px';
    grid.appendChild(sentinel);
    observer.observe(sentinel);
  }
}

const observer = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting) { page++; renderPage(); }
}, { threshold: 0.1 });

function toggleColor(c) {
  const el = document.getElementById('pill-' + c);
  if (activeColors.has(c)) { activeColors.delete(c); el.classList.remove('active'); }
  else { activeColors.add(c); el.classList.add('active'); }
  applyFilters();
}

function clearFilters() {
  document.getElementById('search').value = '';
  document.getElementById('f-type').value = '';
  document.getElementById('f-level').value = '';
  document.getElementById('f-cost').value = '';
  document.getElementById('f-trigger').value = '';
  document.getElementById('f-mechanic').value = '';
  activeColors.clear();
  ['Red','Blue','Yellow','Green','Purple'].forEach(c =>
    document.getElementById('pill-' + c).classList.remove('active'));
  applyFilters();
}

function showDetail(id) {
  const p = allProfiles.find(x => x.profile_id === id);
  if (!p) return;
  detailId = id;
  document.getElementById('d-name').textContent = p.name_en || '—';
  document.getElementById('d-meta').innerHTML = `
    <span class="badge lvl">L${p.level ?? '?'}</span>
    <span class="badge cost">C${p.cost ?? '?'}</span>
    <span class="badge pwr">${p.power ?? '?'}pw</span>
    <span class="badge soul">${p.soul ?? '?'} soul</span>
    ${p.triggers && p.triggers !== 'None' ? `<span class="badge trig">${p.triggers}</span>` : ''}
    <span style="color:#888;font-size:11px">${p.colors || ''}</span>
  `;
  document.getElementById('d-effect').innerHTML = highlight(p.normalized_effect || '—');
  document.getElementById('d-cards').textContent =
    `ID: ${p.profile_id} · ${p.variant_count}× prints · ${p.set_count} sets\n` +
    `Examples: ${(p.example_cards || '').split(', ').slice(0,5).join(', ')}`;
  const btn = document.getElementById('d-pick');
  btn.textContent = cubePicks.has(id) ? '✓ In Cube' : '+ Add to Cube';
  btn.className = 'pick-btn' + (cubePicks.has(id) ? ' picked' : '');
  document.getElementById('detail-panel').classList.add('open');

  // Resize grid
  document.getElementById('card-grid').style.marginRight = '400px';
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('card-grid').style.marginRight = '';
  detailId = null;
}

function togglePick() {
  if (!detailId) return;
  if (cubePicks.has(detailId)) cubePicks.delete(detailId);
  else cubePicks.add(detailId);
  localStorage.setItem('cubePicks', JSON.stringify([...cubePicks]));
  // Update button
  const btn = document.getElementById('d-pick');
  btn.textContent = cubePicks.has(detailId) ? '✓ In Cube' : '+ Add to Cube';
  btn.className = 'pick-btn' + (cubePicks.has(detailId) ? ' picked' : '');
  // Update card border
  const card = document.getElementById('c' + detailId);
  if (card) card.className = 'card' + (cubePicks.has(detailId) ? ' cube-pick' : '') + (card.classList.contains('selected') ? ' selected' : '');
}

// Load data
fetch('../data/card_profiles_all.json')
  .then(r => r.json())
  .then(data => {
    allProfiles = data;
    document.getElementById('stats').textContent =
      `${data.length.toLocaleString()} profiles · ${cubePicks.size} cube picks`;
    applyFilters();
  })
  .catch(e => {
    document.getElementById('card-grid').innerHTML =
      `<div class="no-results">Failed to load data.<br>
       Run a local server: <code>python -m http.server 8000</code><br>
       Then open <a href="http://localhost:8000/review_site/" style="color:#8888ff">localhost:8000/review_site/</a></div>`;
  });
</script>
</body>
</html>
